<flipbook-page *ngFor="let page of pages | reverse"
               [page]="page"
               [width]="model.width / 2"
               [height]="model.height"
               [zoom]="model.zoom"
               [rotation]="page.rotation"
               flipbookGestures
               (mousedown)="onPageDown($event, page)"
               (gesturePan)="onPagePan($event, page)"
               (gesturePanEnd)="onPagePanEnd($event, page)"
               (gestureSwipe)="onSwipe($event, page)">
</flipbook-page>
