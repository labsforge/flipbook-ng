name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Node 16: the library is built with the Angular 13 toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Tag must match the library version
        run: test "v$(node -p "require('./projects/flipbook-lib/package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run build-lib

      - run: npm publish --access public
        working-directory: dist/flipbook-lib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
